[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-image-mcp"
version = "0.2.0"
description = "Local stdio MCP server for 4-bit Qwen-Image-2.1 generation and editing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.13,<1",
]
model = [
  "torch>=2.4",
  "transformers>=5.17",
  "accelerate>=1",
  "bitsandbytes>=0.45",
  "pillow>=10",
  "diffusers @ git+https://github.com/huggingface/diffusers.git",
]

[project.scripts]
qwen-image-mcp = "qwen_image_mcp.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
