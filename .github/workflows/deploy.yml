name: Deploy MCP service

on:
  workflow_dispatch:
    inputs:
      service:
        description: Cloudflare Worker to deploy
        required: true
        type: choice
        options:
          - gemini
          - jev

permissions:
  contents: read

jobs:
  deploy-gemini:
    if: inputs.service == 'gemini'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servers/gemini-mcp
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm install --ignore-scripts
      - run: npm run deploy:preflight
      - run: npx wrangler deploy

  deploy-jev:
    if: inputs.service == 'jev'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servers/jev-cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm run deploy
