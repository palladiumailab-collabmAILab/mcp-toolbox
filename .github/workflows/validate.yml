name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Test
        run: python -m pytest -q

      - name: Compile
        run: python -m compileall -q src

      - name: Validate skills and repository invariants
        run: |
          python scripts/validate-skills.py skills
          test "$(wc -c < AGENTS.md)" -le 32768
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      - name: Build Docker image
        run: docker build -t qwen-coder-subagent-mcp:test .
